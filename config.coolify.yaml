# Non-secret configuration for docker/docker-compose.coolify.yml.
# Coolify injects every credential as an environment variable; do not put
# tokens in this file. Seed /app/.pipeline-runtime/token.json from a browser
# machine before enabling playlist polling.

youtube:
  playlist_id: "REPLACE_ME"
  client_id_op_ref: "unused-in-coolify"
  client_secret_op_ref: "unused-in-coolify" # pragma: allowlist secret
  token_file: "/app/.pipeline-runtime/token.json"
  subtitle_languages: ["en"]

media:
  subtitle_languages: ["en"]

spotify:
  client_id_op_ref: ""
  client_secret_op_ref: ""

transcription:
  model: "mlx-community/parakeet-tdt-0.6b-v3"

bridge:
  # BRIDGE_URL must be the private HTTPS Tailscale Serve hostname of the Mac.
  # The runtime environment overrides this value.
  url: "https://transcriber.example-tailnet.ts.net"
  port: 8081
  auth_token_op_ref: "unused-in-coolify"

github:
  subtitles_repo_url: "https://github.com/REPLACE_ME/youtube-subtitles.git"
  subtitles_repo_path: "/app/data/youtube-subtitles"
  subtitles_branch: "main"
  subtitles_dir_in_repo: "subtitles"
  vault_repo_url: "https://github.com/REPLACE_ME/obsidian-vault.git"
  vault_repo_path: "/app/data/obsidian-vault"
  vault_branch: "main"
  vault_notes_dir: "YouTube Summaries"
  token_op_ref: "unused-in-coolify"
  commit_author_name: "youtube-pipeline-bot"
  commit_author_email: "youtube-pipeline-bot@users.noreply.github.com"

claude:
  command: "claude"
  oauth_token_op_ref: ""

max_retries: 3
state_file: "/app/.pipeline-runtime/state.json"
lock_file: "/app/.pipeline-runtime/pipeline.lock"

bridge_monitor:
  interval_seconds: 60
  timeout_seconds: 10

notifications:
  webhook_url: ""
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: ""
    smtp_password_env_var: "SMTP_PASSWORD" # pragma: allowlist secret
    from_addr: ""
    to_addr: ""

webhook:
  port: 8080
  auth_token_op_ref: "unused-in-coolify"
