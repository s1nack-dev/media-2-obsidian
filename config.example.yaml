# Copy this file to config.yaml and fill in your own values.
# Do NOT commit config.yaml to git (it can contain tokens).

youtube:
  # Used by fetch_playlist.py for playlist polling.
  playlist_id: "PLU_BTwYWjQm8"   # the private playlist you add videos to
  client_id_op_ref: "op://vault/item/client_id"        # 1Password field reference
  client_secret_op_ref: "op://vault/item/client_secret"  # 1Password field reference
  token_file: "token.json"                     # created by youtube_auth.py on first run
  # Legacy alias for media.subtitle_languages below - pipeline.py still
  # reads this if media.subtitle_languages isn't set, so existing
  # config.yaml files keep working unchanged. Prefer media.subtitle_languages
  # in new configs.
  subtitle_languages: ["en"]

media:
  # Language preference order for yt-dlp subtitle download, first available
  # wins. Source-neutral: used for YouTube, generic yt-dlp-supported links,
  # and Spotify's RSS-audio fallback - anywhere pipeline.py calls yt-dlp for
  # captions. Falls back to youtube.subtitle_languages above if this key is
  # absent.
  subtitle_languages: ["en"]

transcription:
  # Keep `bridge` to use the current host_bridge.py + Parakeet/MLX service.
  # Set to `localai` when LocalAI should handle fallback audio transcription.
  provider: "bridge"
  # Used only by `bridge`; this is the existing Parakeet MLX model id.
  model: "mlx-community/parakeet-tdt-0.6b-v3"

bridge:
  # Existing host_bridge.py address and authentication (used only when
  # transcription.provider is `bridge`).
  url: "http://host.docker.internal:8081"
  port: 8081
  auth_token_op_ref: "op://vault/item/bridge_token"

spotify:
  # Optional: enables resolving Spotify episode/show names via the official
  # Spotify Web API (client-credentials flow - metadata only, this app never
  # requests user-data or streaming scopes and never touches Spotify audio).
  # Leave both blank to skip the API entirely - pipeline.py falls back to
  # scraping the public episode page's title/description instead, which
  # works without any Spotify developer account.
  # Create an app at https://developer.spotify.com/dashboard to get these.
  client_id_op_ref: ""
  client_secret_op_ref: ""

localai:
  # OpenAI-compatible LocalAI server used for both fallback transcription and
  # summary/tag chat completions. LOCALAI_URL overrides this value at runtime.
  # Native runs on the Mac: http://127.0.0.1:8081 (LocalAI binds localhost only).
  # Containers and other tailnet machines: the https://<your-host>.<tailnet>.ts.net
  # URL that Tailscale Serve exposes, since host.docker.internal can't reach it.
  url: "http://127.0.0.1:8081"
  # Names configured in LocalAI, not filenames or Hugging Face repo ids.
  # Check the exact names with: curl -s http://127.0.0.1:8081/v1/models
  transcription_model: "parakeet"
  chat_model: "minicpm5-1b-claude-opus-fable5-v2-thinking"
  # The client refuses plain http:// except for 127.0.0.1/localhost, so remote
  # LocalAI (e.g. the Tailscale Serve URL) must use https:// and the key never
  # travels in cleartext. Leave blank if LocalAI is only reachable on a trusted private network.
  # Otherwise put an API-key reference here; LOCALAI_API_KEY takes precedence.
  api_key_op_ref: ""

ai:
  # Keep `claude` to use the existing Claude Code CLI. Set to `localai` to
  # send summaries and tags through LocalAI's chat-completions endpoint.
  provider: "claude"

github:
  # Subtitles repo: where raw subtitle files get committed
  subtitles_repo_url: "https://github.com/s1nack-dev/youtube-subtitles.git"
  subtitles_repo_path: "./git/youtube-subtitles"     # local clone location on this server
  subtitles_branch: "main"
  subtitles_dir_in_repo: "subtitles"           # subfolder inside that repo

  # Obsidian vault repo: where the markdown note gets committed
  vault_repo_url: "https://github.com/s1nack-dev/ai-test-sandbox-obsidian.git"
  vault_repo_path: "./git/ai-test-sandbox-obsidian"             # local clone location on this server
  vault_branch: "main"
  vault_notes_dir: "YouTube Summaries"         # subfolder inside the vault repo

  # A GitHub Personal Access Token. Recommended: a fine-grained token
  # restricted to the two repos above with Contents: Read and write permission
  # only. Fetched from 1Password at runtime.
  token_op_ref: "op://vault/item/credential"

  commit_author_name: "youtube-pipeline-bot"
  commit_author_email: "youtube-pipeline-bot@users.noreply.github.com"

claude:
  command: "claude"
  oauth_token_op_ref: ""


# How many times fetch_playlist.py retries a video that failed (transient
# network error, git push conflict, etc.) before giving up on it
# permanently and notifying you. Not used by pipeline.py's one-off CLI runs.
max_retries: 3

notifications:
  # Optional: any webhook that accepts {"text": "..."} JSON POSTs, e.g. a
  # Slack "Incoming Webhook" URL. Leave blank to disable.
  webhook_url: ""

  # Optional: email alerts via SMTP. Leave enabled: false to disable.
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    smtp_user: "you@gmail.com"
    smtp_password_env_var: "SMTP_PASSWORD"   # read from env, not stored here
    from_addr: "you@gmail.com"
    to_addr: "you@gmail.com"

# Native playlist mode writes here. Docker Compose overrides this with
# PIPELINE_STATE_FILE in its shared .pipeline-runtime/ bind mount so a fresh
# container deployment can create the file safely.
state_file: "state.json"

# Inter-process lock file - serializes playlist state selection and
# process_input() calls across workers to prevent duplicate processing and
# races on shared state.json and git repos. Docker Compose overrides this with
# PIPELINE_LOCK_FILE so both containers use its shared runtime directory.
lock_file: "pipeline.lock"

webhook:
  # Used only by server.py (webhook mode - triggering processing over the
  # network via a Cloudflare Tunnel). Not used by fetch_playlist.py or
  # pipeline.py's CLI.
  port: 8080
  # A 1Password field reference to a random shared-secret token. Callers
  # must send it as `Authorization: Bearer <token>`. Generate one with
  # `openssl rand -hex 32` and store it in 1Password - do not reuse any
  # other credential for this.
  auth_token_op_ref: "op://vault/item/webhook_token"
